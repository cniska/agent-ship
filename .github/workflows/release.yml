name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: agent-ship-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: project

    outputs:
      version: ${{ steps.plan.outputs.version }}
      github-release: ${{ steps.plan.outputs.github-release }}
      github-release-build: ${{ steps.plan.outputs.github-release-build }}
      github-release-assemble: ${{ steps.plan.outputs.github-release-assemble }}
      github-release-files: ${{ steps.plan.outputs.github-release-files }}
      github-release-credentials: ${{ steps.plan.outputs.github-release-credentials }}
      npm: ${{ steps.plan.outputs.npm }}
      npm-build: ${{ steps.plan.outputs.npm-build }}
      npm-smoke: ${{ steps.plan.outputs.npm-smoke }}
      npm-smoke-node: ${{ steps.plan.outputs.npm-smoke-node }}
      npm-credentials: ${{ steps.plan.outputs.npm-credentials }}
      homebrew: ${{ steps.plan.outputs.homebrew }}
      homebrew-tap: ${{ steps.plan.outputs.homebrew-tap }}
      homebrew-formula-name: ${{ steps.plan.outputs.homebrew-formula-name }}
      homebrew-token: ${{ steps.plan.outputs.homebrew-token }}
      homebrew-credentials: ${{ steps.plan.outputs.homebrew-credentials }}

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out agent-ship
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agent-ship
          persist-credentials: false

      - name: Mask credentials
        id: masked
        env:
          SECRETS: ${{ toJSON(secrets) }}
          CREDENTIALS: "[]"
        run: '"$GITHUB_WORKSPACE/agent-ship/scripts/release-secrets"'

      - name: Set up agent-ship's toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: agent-ship

      - name: Install agent-ship's dependencies
        working-directory: agent-ship
        run: bun install --frozen-lockfile

      - name: Check the tag and the credentials
        id: plan
        env:
          TAG: ${{ github.ref_name }}
          SECRET_NAMES: ${{ steps.masked.outputs.names }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bun="$(mise which -C "$GITHUB_WORKSPACE/agent-ship" bun)"
          "$bun" "$GITHUB_WORKSPACE/agent-ship/scripts/release-plan.ts"

  github-release-targets:
    name: GitHub release build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.github-release == 'publish'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: project

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out agent-ship
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agent-ship
          persist-credentials: false

      - name: Mask credentials
        env:
          SECRETS: ${{ toJSON(secrets) }}
          CREDENTIALS: ${{ needs.plan.outputs.github-release-credentials }}
        run: '"$GITHUB_WORKSPACE/agent-ship/scripts/release-secrets"'

      - name: Set up the project's toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: project

      - name: Build the target's files and smoke-test them on its own runner
        env:
          BUILD: ${{ needs.plan.outputs.github-release-build }}
          TARGET: ${{ matrix.target }}
        run: /bin/sh -c "$BUILD"

      - name: Pack the channel's files the build made
        env:
          FILES: ${{ needs.plan.outputs.github-release-files }}
          TARGET: ${{ matrix.target }}
        run: |
          made=()
          while IFS= read -r file; do
            if [ -f "$file" ]; then made+=("$file"); fi
          done <<<"$FILES"
          [ "${#made[@]}" -gt 0 ] || { printf '::error::the build for %s made none of the files the channel names\n' "$TARGET"; exit 1; }
          tar -cf "$RUNNER_TEMP/files.tar" -- "${made[@]}"

      - name: Keep the target's files for the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-release-${{ matrix.target }}
          path: ${{ runner.temp }}/files.tar
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: GitHub release
    needs: [plan, github-release-targets]
    if: needs.plan.outputs.github-release == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write
      attestations: write

    defaults:
      run:
        shell: bash
        working-directory: project

    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out agent-ship
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agent-ship
          persist-credentials: false

      - name: Mask credentials
        env:
          SECRETS: ${{ toJSON(secrets) }}
          CREDENTIALS: ${{ needs.plan.outputs.github-release-credentials }}
        run: '"$GITHUB_WORKSPACE/agent-ship/scripts/release-secrets"'

      - name: Set up agent-ship's toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: agent-ship

      - name: Install agent-ship's dependencies
        working-directory: agent-ship
        run: bun install --frozen-lockfile

      - name: Set up the project's toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: project

      - name: Fetch each target's files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: github-release-*
          path: ${{ runner.temp }}/packed

      - name: Unpack each target's files
        run: |
          for packed in "$RUNNER_TEMP"/packed/github-release-*; do
            target="${packed##*/github-release-}"
            mkdir -p "$RUNNER_TEMP/targets/$target"
            tar -xf "$packed/files.tar" -C "$RUNNER_TEMP/targets/$target"
          done

      - name: Put each target's files at their paths
        env:
          FILES: ${{ needs.plan.outputs.github-release-files }}
        run: |
          bun="$(mise which -C "$GITHUB_WORKSPACE/agent-ship" bun)"
          TARGETS="$RUNNER_TEMP/targets" "$bun" "$GITHUB_WORKSPACE/agent-ship/scripts/target-files.ts"

      - name: Assemble the files that span targets
        if: needs.plan.outputs.github-release-assemble != ''
        env:
          ASSEMBLE: ${{ needs.plan.outputs.github-release-assemble }}
        run: /bin/sh -c "$ASSEMBLE"

      - name: Check that every file is made
        id: files
        env:
          FILES: ${{ needs.plan.outputs.github-release-files }}
        run: |
          delimiter="FILES_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          {
            printf 'subjects<<%s\n' "$delimiter"
            while IFS= read -r file; do
              [ -f "$file" ] || { printf '::error::no target build and no assemble made %s\n' "$file" >&2; exit 1; }
              printf '%s/%s\n' "$PWD" "$file"
            done <<<"$FILES"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"

      - name: Attest the build provenance of every file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.subjects }}

      - name: Create the release as a draft with every file, or attach the absent ones to the published one
        env:
          FILES: ${{ needs.plan.outputs.github-release-files }}
        run: |
          bun="$(mise which -C "$GITHUB_WORKSPACE/agent-ship" bun)"
          "$bun" "$GITHUB_WORKSPACE/agent-ship/scripts/release-files.ts"

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  npm:
    name: npm
    needs: [plan, github-release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.npm == 'publish' && (needs.plan.outputs.npm-build == '' || needs.github-release.result == 'success' || needs.plan.outputs.github-release != 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    outputs:
      install: ${{ steps.packages.outputs.install }}

    defaults:
      run:
        shell: bash
        working-directory: project

    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out agent-ship
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agent-ship
          persist-credentials: false

      - name: Mask credentials
        env:
          SECRETS: ${{ toJSON(secrets) }}
          CREDENTIALS: ${{ needs.plan.outputs.npm-credentials }}
        run: '"$GITHUB_WORKSPACE/agent-ship/scripts/release-secrets"'

      - name: Set up agent-ship's toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: agent-ship

      - name: Install agent-ship's dependencies
        working-directory: agent-ship
        run: bun install --frozen-lockfile

      - name: Set up the project's toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: project

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Put the release's files at their paths
        if: needs.plan.outputs.npm-build != '' && needs.plan.outputs.github-release != 'absent'
        env:
          FILES: ${{ needs.plan.outputs.github-release-files }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while IFS= read -r file; do
            gh release download "$TAG" --pattern "$(basename "$file")" --dir "$(dirname "$file")" --clobber
          done <<<"$FILES"

      - name: Build the packages
        if: needs.plan.outputs.npm-build != ''
        env:
          BUILD: ${{ needs.plan.outputs.npm-build }}
        run: /bin/sh -c "$BUILD"

      - name: Find each package's directory
        id: packages
        run: |
          bun="$(mise which -C "$GITHUB_WORKSPACE/agent-ship" bun)"
          "$bun" "$GITHUB_WORKSPACE/agent-ship/scripts/npm-packages.ts"

      - name: Publish each package with provenance
        env:
          PUBLISH: ${{ steps.packages.outputs.publish }}
        run: |
          while read -r name dir; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              printf '%s@%s is already on the registry\n' "$name" "$VERSION"
              continue
            fi
            npm publish "./$dir" --access public --provenance
          done <<<"$PUBLISH"

      - name: Wait for the registry to serve each package
        env:
          PUBLISH: ${{ steps.packages.outputs.publish }}
        run: |
          while read -r name _; do
            attempt=0
            until npm view "$name@$VERSION" version >/dev/null 2>&1; do
              attempt=$((attempt + 1))
              [ "$attempt" -lt 30 ] || { printf '::error::%s@%s is not on the registry\n' "$name" "$VERSION"; exit 1; }
              sleep 10
            done
          done <<<"$PUBLISH"

  npm-smoke:
    name: npm smoke (${{ matrix.target }}, ${{ matrix.installer }})
    needs: [plan, npm]
    if: needs.plan.outputs.npm == 'publish'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
            installer: npm
          - target: darwin-arm64
            runner: macos-latest
            installer: bun
          - target: linux-x64
            runner: ubuntu-latest
            installer: npm
          - target: linux-x64
            runner: ubuntu-latest
            installer: bun

    defaults:
      run:
        shell: bash
        working-directory: project

    env:
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out agent-ship
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agent-ship
          persist-credentials: false

      - name: Mask credentials
        env:
          SECRETS: ${{ toJSON(secrets) }}
          CREDENTIALS: ${{ needs.plan.outputs.npm-credentials }}
        run: '"$GITHUB_WORKSPACE/agent-ship/scripts/release-secrets"'

      - name: Set up Node
        if: matrix.installer == 'npm' || needs.plan.outputs.npm-smoke-node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Find Node's directory for the smoke
        id: node
        if: needs.plan.outputs.npm-smoke-node == 'true'
        run: printf 'dir=%s\n' "$(dirname "$(command -v node)")" >>"$GITHUB_OUTPUT"

      - name: Set up Bun
        if: matrix.installer == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the version from the registry into a prefix of its own
        env:
          INSTALL: ${{ needs.npm.outputs.install }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          while read -r name; do
            case "$INSTALLER" in
              npm) npm install --global --prefix "$RUNNER_TEMP/global" "$name@$VERSION" ;;
              bun) BUN_INSTALL_GLOBAL_DIR="$RUNNER_TEMP/global/bun" BUN_INSTALL_BIN="$RUNNER_TEMP/global/bin" bun add --global "$name@$VERSION" ;;
              *) printf '::error::no installer %s\n' "$INSTALLER"; exit 1 ;;
            esac
          done <<<"$INSTALL"

      - name: Run the smoke command in the project, with only the installed programs and the system's on PATH
        env:
          SMOKE: ${{ needs.plan.outputs.npm-smoke }}
          NODE_DIR: ${{ steps.node.outputs.dir }}
        run: BIN="$RUNNER_TEMP/global/bin" "$GITHUB_WORKSPACE/agent-ship/scripts/registry-smoke"

  homebrew:
    name: Homebrew
    needs: [plan, github-release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.homebrew == 'publish' && (needs.github-release.result == 'success' || needs.plan.outputs.github-release != 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out agent-ship
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agent-ship
          persist-credentials: false

      - name: Mask credentials
        env:
          SECRETS: ${{ toJSON(secrets) }}
          CREDENTIALS: ${{ needs.plan.outputs.homebrew-credentials }}
        run: '"$GITHUB_WORKSPACE/agent-ship/scripts/release-secrets"'

      - name: Dispatch the tap to repin the formula
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAP: ${{ needs.plan.outputs.homebrew-tap }}
          FORMULA: ${{ needs.plan.outputs.homebrew-formula-name }}
          TOKEN_NAME: ${{ needs.plan.outputs.homebrew-token }}
        run: |
          GH_TOKEN="${!TOKEN_NAME}" gh api --method POST "repos/$TAP/dispatches" \
            -f event_type=formula-release \
            -f "client_payload[formula]=$FORMULA" \
            -f "client_payload[ref]=$TAG" \
            -f "client_payload[version]=$VERSION"
