version = "package.json"
tag = "v<version>"
branch = "main"
check = "bun run check"
signed = false

[channels.github-release]
build = "scripts/build"
assemble = "cd dist && shasum -a 256 -- agent-ship-*.tar.gz >SHA256SUMS.txt"
files = ["dist/agent-ship-darwin-arm64.tar.gz", "dist/agent-ship-linux-x64.tar.gz", "dist/SHA256SUMS.txt"]

[channels.npm]
build = "bun scripts/build-npm.ts dist dist/npm"
out = "dist/npm"
packages = ["@cniska/agent-ship-darwin-arm64", "@cniska/agent-ship-linux-x64", "@cniska/agent-ship"]
smoke = "agent-ship --version"

[channels.homebrew]
tap = "cniska/homebrew-tap"
formula = "Formula/agent-ship.rb"
credentials = ["TAP_DISPATCH_TOKEN"]
